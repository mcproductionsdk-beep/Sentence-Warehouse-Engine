name: Sentence lifecycle regression
on:
  workflow_dispatch:
  pull_request:
    paths: ['engine/**', 'preview/**', 'scripts/**', '.github/workflows/sentence-lifecycle.yml']
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-lifecycle-core.mjs
      - run: node scripts/test-engine-logic.mjs
      - run: node scripts/build-preview.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/test-preview.mjs
      - run: node scripts/test-lifecycle.mjs
