<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sentence Warehouse | Staging preview</title><link rel="stylesheet" href="engine/warehouse.css"><script src="./engine/lifecycle.js" defer></script>
<script src="engine/warehouse.js" defer></script></head><body><section id="menu"><h1>Sentence Warehouse staging preview</h1><p>Fixed Spanish sample for gameplay review. Move with arrows or WASD. Space picks up, delivers or puts down a crate. On mobile, drag to move and tap a crate or slot.</p><button id="play">Play sample</button><p id="error" role="status"></p></section><section id="game" class="game" hidden><div class="top"><h1>SENTENCE WAREHOUSE</h1><div id="hud" class="hud"></div></div><nav class="gamebar" aria-label="Game controls"><button id="pause">PAUSE</button><button id="restart">RESTART</button><button id="back">MAIN MENU</button><button id="sound" aria-pressed="true">SOUND ON</button></nav><section class="sentence-context" tabindex="0" aria-label="Sentence prompt and assembled words"><p id="prompt" aria-live="polite"></p><p id="completedWords" aria-label="Assembled words" aria-live="polite" hidden></p></section><div class="stage"><canvas id="canvas" width="1000" height="660" tabindex="0" aria-label="Warehouse playfield"></canvas><div id="overlay" class="overlay" hidden></div></div><div id="notice" class="notice" role="status"></div><div id="gestureGuide" class="touch" aria-label="Slide to move. Tap to catch and drop."><span class="up">▲</span><span class="left">◀</span><div class="gestureCircle">Slide to move<br>Tap to catch<br>and drop</div><span class="right">▶</span><span class="down">▼</span></div></section></body></html>
